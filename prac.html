<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食品安全与质量控制复习</title>
  <style>
    :root {
      --bg: #f4f6f1;
      --panel: #fffdf7;
      --panel-2: #f7fbff;
      --text: #18201a;
      --muted: #667065;
      --line: #d8ded2;
      --accent: #276f6b;
      --accent-2: #8d4f23;
      --bad: #b9383b;
      --good: #287a46;
      --warn: #9a6a00;
      --shadow: 0 18px 50px rgba(28, 45, 30, 0.11);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: linear-gradient(180deg, #f1f6f2 0%, #f7f4ed 48%, #f4f6f1 100%);
      font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    button, input, textarea, select {
      font: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 7px;
      min-height: 38px;
      padding: 8px 12px;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    button:hover { transform: translateY(-1px); border-color: #97aaa0; }
    button:disabled { opacity: .48; cursor: not-allowed; transform: none; }
    .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .danger { color: var(--bad); border-color: #e0b4b6; }
    .quiet { background: transparent; }
    .app {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      padding: 8px 0 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 760px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 10px;
      margin: 10px 0 18px;
    }
    .stat {
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .stat strong {
      display: block;
      font-size: 24px;
      line-height: 1.2;
    }
    .stat span { color: var(--muted); font-size: 13px; }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .controls {
      padding: 14px;
      position: sticky;
      top: 12px;
    }
    .section-title {
      margin: 6px 0 10px;
      font-size: 15px;
      font-weight: 700;
      color: #30382f;
    }
    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .segmented button.active, .type-grid button.active, .range-row button.active {
      background: #dceee7;
      border-color: var(--accent);
      color: #153d3a;
      font-weight: 700;
    }
    .type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .range-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .start-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .searchbox {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      padding: 9px 10px;
      margin-top: 8px;
    }
    .search-results {
      max-height: 260px;
      overflow: auto;
      display: grid;
      gap: 8px;
      margin-top: 10px;
      padding-right: 2px;
    }
    .mini-item {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px;
      background: #fff;
      cursor: pointer;
    }
    .mini-item:hover { border-color: var(--accent); }
    .mini-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }
    .mini-stem {
      margin-top: 4px;
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .main {
      min-height: 620px;
      overflow: hidden;
    }
    .content-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.62);
    }
    .content-title {
      font-size: 18px;
      font-weight: 800;
    }
    .content-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .stage {
      padding: 18px;
    }
    .empty {
      padding: 46px 20px;
      text-align: center;
      color: var(--muted);
    }
    .question-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
    }
    .question-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f7f8f4;
      color: #364039;
      font-size: 13px;
      font-weight: 700;
    }
    .tag.star { color: #7d4a00; border-color: #e4c680; background: #fff6d7; }
    .tag.double { color: #8b2727; border-color: #e6aaa2; background: #fff0ec; }
    .tag.good { color: var(--good); background: #e9f6ee; border-color: #aed8bd; }
    .tag.bad { color: var(--bad); background: #fff0f0; border-color: #e4b2b4; }
    .tag.warn { color: var(--warn); background: #fff7dc; border-color: #e4cd86; }
    .stem {
      font-size: 21px;
      line-height: 1.55;
      margin: 0 0 16px;
      word-break: break-word;
    }
    .options {
      display: grid;
      gap: 9px;
      margin: 12px 0 14px;
    }
    .option {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      background: #fbfcf8;
      border-radius: 7px;
      padding: 10px;
      cursor: pointer;
    }
    .option input { margin-top: 5px; }
    .option strong { margin-right: 6px; }
    textarea.answer-input {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
    }
    .blank-grid {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }
    .blank-input {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 8px;
      align-items: center;
    }
    .blank-input input {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 10px;
      min-width: 0;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .answer-panel {
      margin-top: 16px;
      border: 1px solid #cfd7cb;
      border-radius: var(--radius);
      background: var(--panel-2);
      padding: 14px;
    }
    .answer-panel h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .answer-block {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      margin: 8px 0;
    }
    .review-list {
      display: grid;
      gap: 12px;
    }
    .review-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 14px;
    }
    .review-item.wrong-review {
      position: relative;
      border: 2px solid #d95b5f;
      background: #fff7f5;
      box-shadow: 0 16px 42px rgba(185, 56, 59, .16);
    }
    .review-item.wrong-review::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      border-radius: 6px 0 0 6px;
      background: var(--bad);
    }
    .review-item h3 {
      margin: 8px 0;
      font-size: 18px;
    }
    .wrong-banner {
      margin: 10px 0;
      border: 1px solid #e1a5a8;
      border-radius: 7px;
      background: #ffe7e4;
      color: #8d2528;
      padding: 8px 10px;
      font-weight: 800;
    }
    .self-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .self-row button.mastered.active { background: #dff2e6; border-color: var(--good); color: var(--good); font-weight: 800; }
    .self-row button.unfamiliar.active { background: #ffe0e0; border-color: var(--bad); color: var(--bad); font-weight: 800; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 28, 21, .36);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 10;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(760px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .modal h2 { margin: 0 0 10px; font-size: 20px; }
    .modal textarea {
      width: 100%;
      min-height: 180px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      resize: vertical;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: #17251c;
      color: #fff;
      padding: 9px 12px;
      border-radius: 7px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 20;
      max-width: calc(100vw - 32px);
    }
    .toast.show { opacity: 1; }
    .hidden { display: none !important; }
    .small { font-size: 13px; color: var(--muted); }
    .divider { height: 1px; background: var(--line); margin: 14px 0; }
    @media (max-width: 860px) {
      .topbar, .layout { grid-template-columns: 1fr; }
      .toolbar { justify-content: flex-start; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls { position: static; }
      .content-head { align-items: flex-start; flex-direction: column; }
      .content-actions { justify-content: flex-start; }
      .stem { font-size: 18px; }
    }
    @media (max-width: 520px) {
      .app { width: min(100vw - 18px, 1180px); padding-top: 12px; }
      .stats { grid-template-columns: 1fr; }
      .type-grid, .segmented, .range-row, .start-row { grid-template-columns: 1fr; }
      .stage, .question-card { padding: 12px; }
      .blank-input { grid-template-columns: 1fr; }
      button { width: 100%; }
      .actions, .self-row, .toolbar { display: grid; grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>食品安全与质量控制复习</h1>
        <p class="subtitle">按题型、随机、重点和错题反复练。选择题判断对错；填空和主观题看答案后自评。</p>
      </div>
      <div class="toolbar">
        <button id="exportBtn" title="导出学习数据">导出</button>
        <button id="importBtn" title="导入学习数据">导入</button>
        <button id="resetBtn" class="danger" title="清空本地记录">清空记录</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="layout">
      <aside class="panel controls">
        <div class="section-title">出题模式</div>
        <div class="segmented">
          <button data-mode="type" class="active">按题型</button>
          <button data-mode="random">随机</button>
          <button data-mode="wrong">错题本</button>
          <button data-mode="search">搜索</button>
        </div>

        <div id="practiceControls">
          <div id="typeControls">
            <div class="section-title">题型</div>
            <div class="type-grid" id="typeButtons"></div>
          </div>

          <div class="section-title">范围</div>
          <div class="range-row">
            <button data-range="all" class="active">全部题目</button>
            <button data-range="priority">只做重点题</button>
          </div>

          <div class="start-row">
            <button id="startBtn" class="primary">开始练习</button>
            <button id="oneRandomBtn">来一题</button>
          </div>
        </div>

        <div id="wrongControls" class="hidden">
          <div class="section-title">错题题型</div>
          <div class="type-grid" id="wrongTypeButtons"></div>
          <div class="start-row">
            <button id="startWrongBtn" class="primary">重做错题</button>
            <button id="showWrongBtn">查看错题</button>
          </div>
        </div>

        <div id="searchControls" class="hidden">
          <div class="section-title">搜索题库</div>
          <input id="searchInput" class="searchbox" type="search" placeholder="输入关键词、题号或答案">
          <div class="search-results" id="searchResults"></div>
        </div>

        <div class="divider"></div>
        <div class="small" id="bankSummary"></div>
      </aside>

      <main class="panel main">
        <div class="content-head">
          <div>
            <div class="content-title" id="viewTitle">准备开始</div>
            <div class="small" id="viewSubTitle">选择一种模式开始复习。</div>
          </div>
          <div class="content-actions">
            <button id="prevBtn" disabled>上一题</button>
            <button id="nextBtn" disabled>下一题</button>
            <button id="finishBtn" disabled>退出并检查</button>
          </div>
        </div>
        <div class="stage" id="stage"></div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modalTitle">编辑</h2>
      <div id="modalBody"></div>
      <div class="actions">
        <button id="modalSave" class="primary">保存</button>
        <button id="modalCancel">取消</button>
      </div>
    </div>
  </div>
  <input id="importFile" type="file" accept="application/json" class="hidden">
  <div class="toast" id="toast"></div>

  <script>

ty":"star"},{"id":"term-19","type":"term","group":"名词解释","number":19,"stem":"抽样检验","options":[],"answer":"按数理统计的方法，从一批待检产品中随机抽取一定数量的样本，并对样本进行全数检验，再根据样本的检验结果来判定整批产品的质量状况并做出接收或拒收的结论。","answerText":"按数理统计的方法，从一批待检产品中随机抽取一定数量的样本，并对样本进行全数检验，再根据样本的检验结果来判定整批产品的质量状况并做出接收或拒收的结论。","blanks":[],"starLevel":1,"levelLabel":"★","isPriority":true,"sourcePriority":"star"},{"id":"term-20","type":"term","group":"名词解释","number":20,"stem":"检验批","options":[],"answer":"为实施抽样检验而汇总起来的在同一条件下生产出来的若干单位产品。","answerText":"为实施抽样检验而汇总起来的在同一条件下生产出来的若干单位产品。","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"term-21","type":"term","group":"名词解释","number":21,"stem":"不合格","options":[],"answer":"单位产品的任何一个质量特性不满足规范要求。","answerText":"单位产品的任何一个质量特性不满足规范要求。","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"term-22","type":"term","group":"名词解释","number":22,"stem":"不合格品","options":[],"answer":"有一个或一个以上不合格的单位产品，称为不合格品。","answerText":"有一个或一个以上不合格的单位产品，称为不合格品。","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"term-23","type":"term","group":"名词解释","number":23,"stem":"批质量p","options":[],"answer":"一批产品的质量以不合格品率(或缺陷数)来衡量，p(不合格品率)=D(不合格品个数)/N(总数)。","answerText":"一批产品的质量以不合格品率(或缺陷数)来衡量，p(不合格品率)=D(不合格品个数)/N(总数)。","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"term-24","type":"term","group":"名词解释","number":24,"stem":"接收概率L(p)","options":[],"answer":"用给定的抽样方案(n，Ac)去验收批量N和批质量p。，已知的连续检验批时，把检验批判为合格而接收的概率。","answerText":"用给定的抽样方案(n，Ac)去验收批量N和批质量p。，已知的连续检验批时，把检验批判为合格而接收的概率。","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"term-25","type":"term","group":"名词解释","number":25,"stem":"抽样特性曲线(OC)","options":[],"answer":"对于一定的抽样方案(N、n丶Ac)来说，每一个p值都对应着唯一的接收概率L(p)。当p值连续变化时，特定抽检方案的接收概率L(p)随p值的变化规律称为抽样特性。在直角坐标系中将这一规律用曲线描绘出来，就称为抽样特性曲线，简称OC曲线。","answerText":"对于一定的抽样方案(N、n丶Ac)来说，每一个p值都对应着唯一的接收概率L(p)。当p值连 velLabel":"★","isPriority":true,"sourcePriority":"star"},{"id":"essay-2","type":"essay","group":"简答/论述题","number":2,"stem":"影响食品质量的因素","options":[],"answer":"(1)动物生产条件 (2)动物的运输和屠宰条件 (3)果蔬产品的栽培和收获条件 (4)食品加工条件 (5)储存和销售条件","answerText":"(1)动物生产条件 (2)动物的运输和屠宰条件 (3)果蔬产品的栽培和收获条件 (4)食品加工条件 (5)储存和销售条件","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-3","type":"essay","group":"简答/论述题","number":3,"stem":"影响食品安全的因素","options":[],"answer":"(1)生物源性危害因素:细菌、真菌、病毒、寄生虫 (2)化学源性危害因素:①天然存在的化学物质(生物毒素等) ②有意加入的化学物质(食品添加剂) ③无意或偶尔进入食品的化学物质(农药兽药残留、环境污染物、食品加工过程和包装材料产生的化学物质) (3)物理源性危害因素:食品放射性污染，杂物污染 *(食品的物理源危害是指食品在生产加工过程中，杂质超过规定的含量，或食品吸附、吸收外来的放射性核素所引起的食品污染。)","answerText":"(1)生物源性危害因素:细菌、真菌、病毒、寄生虫 (2)化学源性危害因素:①天然存在的化学物质(生物毒素等) ②有意加入的化学物质(食品添加剂) ③无意或偶尔进入食品的化学物质(农药兽药残留、环境污染物、食品加工过程和包装材料产生的化学物质) (3)物理源性危害因素:食品放射性污染，杂物污染 *(食品的物理源危害是指食品在生产加工过程中，杂质超过规定的含量，或食品吸附、吸收外来的放射性核素所引起的食品污染。)","blanks":[],"starLevel":1,"levelLabel":"★","isPriority":true,"sourcePriority":"star"},{"id":"essay-4","type":"essay","group":"简答/论述题","number":4,"stem":"简述食品安全风险分析的要素及其关系(1)要素:风险评估、风险管理、风险交流","options":[],"answer":"(2)关系:三部分是相互补充且必不可少的，是一个高度统一的整体。风险评估强调科学性、重点是科学，风险管理强调实用性、重点在政策，风险交流强调互动性和信息的交换","answerText":"(2)关系:三部分是相互补充且必不可少的，是一个高度统一的整体。风险评估强调科学性、重点是科学，风险管理强调实用性、重点在政策，风险交流强调互动性和信息的交换","blanks":[],"starLevel":1,"levelLabel":"★","isPriority":true,"sourcePriority":"star"},{"id":"essay-5","type":"essay","group":"简答/论述题","number":5,"stem":"影响食品安全的生物源性危害","options":[],"answer":"(1)细菌:沙门氏菌、副溶血性弧菌、肉毒梭状芽孢杆菌、金黄色葡萄球菌、李斯特氏菌、大肠埃希氏菌、志贺氏菌、阪崎肠杆菌、幽门螺旋杆菌、椰毒假单胞菌等 (2)霉菌与霉菌毒素:黄曲霉毒素、赭曲霉毒素、伏马毒素、玉米赤霉烯酮等 (3)病毒:朊病毒、禽流感病毒、肝炎病毒、诺瓦克病毒等 (4)寄生虫:囊虫、旋毛虫、华枝睾吸虫、广州管圆线虫、卫氏并殖吸虫、姜片虫、蛔虫等","answerText":"(1)细菌:沙门氏菌、副溶血性弧菌、肉毒梭状芽孢杆菌、金黄色葡萄球菌、李斯特氏菌、大肠埃希氏菌、志贺氏菌、阪崎肠杆菌、幽门螺旋杆菌、椰毒假单胞菌等 (2)霉菌与霉菌毒素:黄曲霉毒素、赭曲霉毒素、伏马毒素、玉米赤霉烯酮等 (3)病毒:朊病毒、禽流感病毒、肝炎病毒、诺瓦克病毒等 (4)寄生虫:囊虫、旋毛虫、华枝睾吸虫、广州管圆线虫、卫氏并殖吸虫、姜片虫、蛔虫等","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-6","type":"essay","group":"简答/论述题","number":6,"stem":"影响食品安全的化学源性危害因素","options":[],"answer":"(1)食品中天然存在的有毒物质:动物源性食品中的天然有毒物质有河豚毒素、组胺、贝类和螺类毒素等，植物源性食品中的天然有毒物质有龙葵碱、秋水仙碱、棉酚、大麻酚、白果酸等，此外还有蕈菌毒素 (2)有意加入的化学危害:食品添加剂 (3)农药兽药残留 (4)环境污染:有害重金属(铅、汞、镉)、持续性有机污染物POPs(多氯联苯PCBs、二噁英) (5)食品加工中产生的化学危害物质:氯丙醇、N-亚硝基类化合物、多环芳烃类化合物PAHs (6)食品包装材料中的化学危害物质:例食品包装用纸中的荧光增白剂、重金属、甲醛、多氯联苯、二噁英、二苯甲酮、芳香族碳水化合物、防油剂等","answerText":"(1)食品中天然存在的有毒物质:动物源性食品中的天然有毒物质有河豚毒素、组胺、贝类和螺类毒素等，植物源性食品中的天然有毒物质有龙葵碱、秋水仙碱、棉酚、大麻酚、白果酸等，此外还有蕈菌毒素 (2)有意加入的化学危害:食品添加剂 (3)农药兽药残留 (4)环境污染:有害重金属(铅、汞、镉)、持续性有机污染物POPs(多氯联苯PCBs、二噁英) (5)食品加工中产生的化学危害物质:氯丙醇、N-亚硝基类化合物、多环芳烃类化合物PAHs (6)食品包装材料中的化学危害物质:例食品包装用纸中的荧光增白剂、重金属、甲醛、多氯联苯、二噁英、二苯甲酮、芳香族碳水化合物、防油剂等","blanks":[],"starLevel":1,"levelLabel":"★","isPriority":true,"sourcePriority":"star"},{"id":"essay-7","type":"essay","group":"简答/论述题","number":7,"stem":"预防食品中农药残留的措施","options":[],"answer":"①加强农药管理 ②合理安全使用农药 ③制定和完善农药残留限量标准 ④开发高效低毒低残留农药，推广应用生物农药 ⑤食品农药残留的消除","answerText":"①加强农药管理 ②合理安全使用农药 ③制定和完善农药残留限量标准 ④开发高效低毒低残留农药，推广应用生物农药 ⑤食品农药残留的消除","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-8","type":"essay","group":"简答/论述题","number":8,"stem":"重金属的污染特点","options":[],"answer":"①来源广、残留时间长、能沿着食物链转移富集，有放大作用。 ②重金属离子在自然环境中不能被破坏。 ③水体中的某些重金属可在微生物作用下转化为毒性更强的金属化合物。 ④只要有微量重金属即可产生毒性效应。","answerText":"①来源广、残留时间长、能沿着食物链转移富集，有放大作用。 ②重金属离子在自然环境中不能被破坏。 ③水体中的某些重金属可在微生物作用下转化为毒性更强的金属化合物。 ④只要有微量重金属即可产生毒性效应。","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-9","type":"essay","group":"简答/论述题","number":9,"stem":"常用食品包装材料和容器","options":[],"answer":"①纸和纸包装容器 ②塑料和塑料包装容器 ③金属和金属包装容器 ④复合材料及其包装容器 ⑤玻璃陶瓷容器 ⑥木质容器 ⑦其他:麻袋、布袋、草、竹等","answerText":"①纸和纸包装容器 ②塑料和塑料包装容器 ③金属和金属包装容器 ④复合材料及其包装容器 ⑤玻璃陶瓷容器 ⑥木质容器 ⑦其他:麻袋、布袋、草、竹等","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-10","type":"essay","group":"简答/论述题","number":10,"stem":"塑料包装材料中有毒物质的来源","options":[],"answer":"①树脂本身具有一定毒性 ②塑料包装容器表面的微尘杂质及微生物污染 ③塑料制品在制作过程中添加的稳定剂、增稠剂、抗氧化剂、抗静电剂、着色剂等带来的危害 ④塑料回收再利用时附着的一些污染物和添加的色素可造成食品的污染 ⑤油墨污染 ⑥复合薄膜用黏合剂","answerText":"①树脂本身具有一定毒性 ②塑料包装容器表面的微尘杂质及微生物污染 ③塑料制品在制作过程中添加的稳定剂、增稠剂、抗氧化剂、抗静电剂、着色剂等带来的危害 ④塑料回收再利用时附着的一些污染物和添加的色素可造成食品的污染 ⑤油墨污染 ⑥复合薄膜用黏合剂","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-11","type":"essay","group":"简答/论述题","number":11,"stem":"七大质量控制工具及其作用","options":[],"answer":"(1)调查表:收集数据 (2)分层法:把收集的数据分类汇总 (3)排列图:找出影响产品质量的主要问题，确定改进关键项目 (4)因果图:分析质量特性(结果)与可能影响质量特性的因素(原因) (5)直方图: 看问题的分布情况 (6)散布图:研究两组数据(两个因素)之间的相关关系 (7)控制图:对过程质量特性值进行监控和评估","answerText":"(1)调查表:收集数据 (2)分层法:把收集的数据分类汇总 (3)排列图:找出影响产品质量的主要问题，确定改进关键项目 (4)因果图:分析质量特性(结果)与可能影响质量特性的因素(原因) (5)直方图: 看问题的分布情况 (6)散布图:研究两组数据(两个因素)之间的相关关系 (7)控制图:对过程质量特性值进行监控和评估","blanks":[],"starLevel":2,"levelLabel":"★★","isPriority":true,"sourcePriority":"star"},{"id":"essay-12","type":"essay","group":"简答/论述题","number":12,"stem":"直方图的制作步骤","options":[],"answer":"①收集数据 ②计算数据的极差 ③确定组距 ④确定各组的边界值 ⑤绘制频数分布表 ⑥画直方图","answerText":"①收集数据 ②计算数据的极差 ③确定组距 ④确定各组的边界值 ⑤绘制频数分布表 ⑥画直方图","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-13","type":"essay","group":"简答/论述题","number":13,"stem":"控制图的制作步骤","options":[],"answer":"①预备数据的获取:随机抽取k组②(20~25组)，样本量为n(常取5) ②计算统计量:先计算每组数据的平均值和极差，记入表中；再计算总平均值和极差平均值 ③计算控制界线、做控制图、打点判断:先计算R图，再计算x̄ 图","answerText":"①预备数据的获取:随机抽取k组②(20~25组)，样本量为n(常取5) ②计算统计量:先计算每组数据的平均值和极差，记入表中；再计算总平均值和极差平均值 ③计算控制界线、做控制图、打点判断:先计算R图，再计算x̄ 图","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-14","type":"essay","group":"简答/论述题","number":14,"stem":"什么是工序能力？","options":[],"answer":"工序能力是指过程加工方面满足加工质量的能力，它是衡量加工内在一致性的、最稳态下的最小波动。过程处于稳态时，产品的质量特性值有99.73%散布在区间[μ-3σ，μ+3σ]，通常用±3σ表示过程能力，它的值越小越好。","answerText":"工序能力是指过程加工方面满足加工质量的能力，它是衡量加工内在一致性的、最稳态下的最小波动。过程处于稳态时，产品的质量特性值有99.73%散布在区间[μ-3σ，μ+3σ]，通常用±3σ表示过程能力，它的值越小越好。","blanks":[],"starLevel":2,"levelLabel":"★★","isPriority":true,"sourcePriority":"star"},{"id":"essay-15","type":"essay","group":"简答/论述题","number":15,"stem":"食品质量检验的基本功能有哪些？","options":[],"answer":"①鉴别:判定产品质量是否合规 ②把关:剔除不合格品 ③预防:质量控制 ④报告:信息反馈","answerText":"①鉴别:判定产品质量是否合规 ②把关:剔除不合格品 ③预防:质量控制 ④报告:信息反馈","blanks":[],"starLevel":2,"levelLabel":"★★","isPriority":true,"sourcePriority":"star"},{"id":"essay-16","type":"essay","group":"简答/论述题","number":16,"stem":"什么是抽样检验？抽样检验的两类风险？","options":[],"answer":"(1)抽样检验:按数理统计的方法，从一批待检产品中随机抽取一定数量的样本，并对样本进行全数检验，再根据样本的检验结果来判定整批产品的质量状况，并作出接收或拒收的结论。 (2)抽样检验的两类风险:①生产者风险: 设P0 是可接受的质量水平的上限(通常用AQL表示)，即批不合格品率P≤P0时，说明批质量是合格的，应100%接收。然而实际上当P=P0时，交验批只能以1-α的概率被接收。这种错判会使生产者受到损失。所以α被称为生产者风险。α=1-L(P0) ②使用者风险:设P1为可接受的极限不合格品率(通常用LTPD表示)，即如果批不合格品率P≥P1时，应该100%拒收。然而实际上当P=P1时，仍然有可能以β的概率被接收。这种错判会使使用者受到损失，所以β被称为使用者风险。","answerText":"(1)抽样检验:按数理统计的方法，从一批待检产品中随机抽取一定数量的样本，并对样本进行全数检验，再根据样本的检验结果来判定整批产品的质量状况，并作出接收或拒收的结论。 (2)抽样检验的两类风险:①生产者风险: 设P0 是可接受的质量水平的上限(通常用AQL表示)，即批不合格品率P≤P0时，说明批质量是合格的，应100%接收。然而实际上当P=P0时，交验批只能以1-α的概率被接收。这种错判会使生产者受到损失。所以α被称为生产者风险。α=1-L(P0) ②使用者风险:设P1为可接受的极限不合格品率(通常用LTPD表示)，即如果批不合格品率P≥P1时，应该100%拒收。然而实际上当P=P1时，仍然有可能以β的概率被接收。这种错判会使使用者受到损失，所以β被称为使用者风险。","blanks":[],"starLevel":2,"levelLabel":"★★","isPriority":true,"sourcePriority":"star"},{"id":"essay-17","type":"essay","group":"简答/论述题","number":17,"stem":"什么是抽样特性曲线？实际好的抽样特性曲线应具备哪些特点？","options":[],"answer":"(1)抽样特性曲线:对于一定的抽样方案(N，n，Ac)来说，每一个不同的P值(不合格品率)都对应着唯一的接收概率L(p)。当P值连续变化时，特定抽样方案的接收概率L(p)随p值的变化规律称为抽样特性。在直角坐标系中将这一规律用曲线描绘出来，就称为抽样特性曲线，简称OC曲线。 (2)实际好的抽样特性曲线的特点:①当这批质量较好时，即P≤P0时，应以高概率判定它合格。 ②当这批质量较差时，且已超过某个规定界限，如P≥P1时，应以高概率判定他不合格。 ③当产品质量在P0和P1之间时，接收概率应迅速减小。","answerText":"(1)抽样特性曲线:对于一定的抽样方案(N，n，Ac)来说，每一个不同的P值(不合格品率)都对应着唯一的接收概率L(p)。当P值连续变化时，特定抽样方案的接收概率L(p)随p值的变化规律称为抽样特性。在直角坐标系中将这一规律用曲线描绘出来，就称为抽样特性曲线，简称OC曲线。 (2)实际好的抽样特性曲线的特点:①当这批质量较好时，即P≤P0时，应以高概率判定它合格。 ②当这批质量较差时，且已超过某个规定界限，如P≥P1时，应以高概率判定他不合格。 ③当产品质量在P0和P1之间时，接收概率应迅速减小。","blanks":[],"starLevel":2,"levelLabel":"★★","isPriority":true,"sourcePriority":"star"},{"id":"essay-18","type":"essay","group":"简答/论述题","number":18,"stem":"SSOP八项内容","options":[],"answer":"①与食品接触的水(冰)的安全 ②与食品接触的表面清洁和卫生程度 ③预防交叉污染 ④洗手、手消毒和卫生间设施 ⑤防止污染物污染 ⑥有害化合物的存储、管理和使用 ⑦员工健康状况的控制 ⑧害虫的防治","answerText":"①与食品接触的水(冰)的安全 ②与食品接触的表面清洁和卫生程度 ③预防交叉污染 ④洗手、手消毒和卫生间设施 ⑤防止污染物污染 ⑥有害化合物的存储、管理和使用 ⑦员工健康状况的控制 ⑧害虫的防治","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-19","type":"essay","group":"简答/论述题","number":19,"stem":"HACCP七大原理","options":[],"answer":"①危害分析(HA) ②确定关键控制点(CCP) ③建立关键限制(CL) ④建立(关键控制点的)监控程序 ⑤建立纠正措施程序(当监控表明某个CCP失控时) ⑥建立验证程序(证明HACCP体系运行有效) ⑦建立文件和记录的保持系统(关于所有适用程序、原理及其应用)","answerText":"①危害分析(HA) ②确定关键控制点(CCP) ③建立关键限制(CL) ④建立(关键控制点的)监控程序 ⑤建立纠正措施程序(当监控表明某个CCP失控时) ⑥建立验证程序(证明HACCP体系运行有效) ⑦建立文件和记录的保持系统(关于所有适用程序、原理及其应用)","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"},{"id":"essay-20","type":"essay","group":"简答/论述题","number":20,"stem":"什么是危害分析与关键控制点？","options":[],"answer":"危害分析是指分析会对食品产生潜在的健康危害的生物、化学或物理因素或状态。关键控制点是指能实施控制，从而对食品安全危害加以预防、消除、或把它降低到可接受水平的一个加工点、步骤或工序。","answerText":"危害分析是指分析会对食品产生潜在的健康危害的生物、化学或物理因素或状态。关键控制点是指能实施控制，从而对食品安全危害加以预防、消除、或把它降低到可接受水平的一个加工点、步骤或工序。","blanks":[],"starLevel":2,"levelLabel":"★★","isPriority":true,"sourcePriority":"star"},{"id":"essay-21","type":"essay","group":"简答/论述题","number":21,"stem":"建立和实施HACCP的步骤","options":[],"answer":"①组建HACCP工作小组 ②描述产品 ③确定预期用途 ④制作流程图 ⑤流程图的现场确认 ⑥列出所有潜在的危害并进行危害分析(HA) ⑦确定关键控制点(CCP) ⑧为各个关键控制点(CCP)建立关键限制(CL) ⑨为各个关键控制点(CCP)建立监控系统 ⑩为各个关键控制点(CCP)建立纠偏措施 ⑪建立验证程序 ⑫建立文件化和记录保持的程序","answerText":"①组建HACCP工作小组 ②描述产品 ③确定预期用途 ④制作流程图 ⑤流程图的现场确认 ⑥列出所有潜在的危害并进行危害分析(HA) ⑦确定关键控制点(CCP) ⑧为各个关键控制点(CCP)建立关键限制(CL) ⑨为各个关键控制点(CCP)建立监控系统 ⑩为各个关键控制点(CCP)建立纠偏措施 ⑪建立验证程序 ⑫建立文件化和记录保持的程序","blanks":[],"starLevel":2,"levelLabel":"★★","isPriority":true,"sourcePriority":"star"},{"id":"essay-22","type":"essay","group":"简答/论述题","number":22,"stem":"GMP/SSOP与HACCP的关系","options":[],"answer":"GMP-良好生产规范，是最基本条件、强制性。SSOP-卫生标准操作程序，为公司内部管理，没有GMP的强制性。HACCP-危害分析与关键控制点，建议在GMP和SSO报基础之上，有较强的针对性，重点控制食品安全方面的显著性危害。","answerText":"GMP-良好生产规范，是最基本条件、强制性。SSOP-卫生标准操作程序，为公司内部管理，没有GMP的强制性。HACCP-危害分析与关键控制点，建议在GMP和SSO报基础之上，有较强的针对性，重点控制食品安全方面的显著性危害。","blanks":[],"starLevel":2,"levelLabel":"★★","isPriority":true,"sourcePriority":"star"},{"id":"essay-23","type":"essay","group":"简答/论述题","number":23,"stem":"应用HACCP的优点","options":[],"answer":"①在问题出现之前就可采取纠正措施，因而是积极主动的控制 ②通过易于监视的特性(如时间、温度和外观)实时控制，方法简单、直观、可操作性强、快速。 ③由于控制集中于生产操作的关注点，就可以对每批样品采取更多的保证措施，使工厂重视工艺的改进，降低产品损耗。 ④与依靠化学分析、微生物检验进行控制相比，费用低廉 ⑤HACCP能用于潜在危害的预告，能及时纠错、迅速控制","answerText":"①在问题出现之前就可采取纠正措施，因而是积极主动的控制 ②通过易于监视的特性(如时间、温度和外观)实时控制，方法简单、直观、可操作性强、快速。 ③由于控制集中于生产操作的关注点，就可以对每批样品采取更多的保证措施，使工厂重视工艺的改进，降低产品损耗。 ④与依靠化学分析、微生物检验进行控制相比，费用低廉 ⑤HACCP能用于潜在危害的预告，能及时纠错、迅速控制","blanks":[],"starLevel":0,"levelLabel":"普通","isPriority":false,"sourcePriority":"normal"}];
    const STORAGE_KEY = "fsqc-review-state-v1";
    const GROUPS = ["选择题", "名词解释", "填空题", "简答/论述题"];
    const SELF_LABELS = { mastered: "掌握", unfamiliar: "不熟悉" };

    let state = loadState();
    let mode = "type";
    let selectedGroup = "选择题";
    let selectedWrongGroup = "全部";
    let selectedRange = "all";
    let session = null;
    let currentReview = null;
    let currentIndex = 0;
    let modalHandler = null;

    const byId = Object.fromEntries(QUESTION_BANK.map(q => [q.id, q]));
    const el = id => document.getElementById(id);

    function defaultState() {
      return { answers: {}, self: {}, wrong: {}, blankOverrides: {}, history: [] };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...defaultState(), ...JSON.parse(raw) } : defaultState();
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderStats();
    }

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function questionLevelClass(q) {
      if (q.starLevel === 2) return "double";
      if (q.starLevel === 1) return "star";
      return "";
    }

    function isChoice(q) {
      return q.group === "选择题";
    }

    function getBlankList(q) {
      return state.blankOverrides[q.id] || q.blanks || [];
    }

    function formatAnswer(q) {
      if (isChoice(q)) {
        if (q.answer.length === 1 && (q.answer[0] === "对" || q.answer[0] === "错")) return q.answer[0];
        return q.answer.join("");
      }
      if (q.group === "填空题") {
        return getBlankList(q).map((item, index) => `${index + 1}. ${item}`).join("\\n");
      }
      return q.answerText || q.answer || "";
    }

    function getQuestionUserAnswer(q) {
      const saved = state.answers[q.id];
      if (!saved) return "";
      if (Array.isArray(saved.value)) return saved.value.join("");
      return saved.value || "";
    }

    function answerSignature(answerData) {
      return JSON.stringify({
        value: answerData.value ?? "",
        blankValues: answerData.blankValues || null,
      });
    }

    function hasAnyAnswer(q, answerData) {
      if (!answerData) return false;
      if (isChoice(q)) return Array.isArray(answerData.value) && answerData.value.length > 0;
      if (q.group === "填空题") return Array.isArray(answerData.blankValues) && answerData.blankValues.some(value => value.trim());
      return !!String(answerData.value || "").trim();
    }

    function normalizedSelf(value) {
      if (value === "mastered") return "mastered";
      if (value === "unfamiliar" || value === "unsure" || value === "wrong") return "unfamiliar";
      return "";
    }

    function isChoiceAnswerCorrect(q, answerData) {
      const selected = [...(answerData.value || [])].sort();
      const expected = [...q.answer].sort();
      return selected.length === expected.length && selected.every((value, index) => value === expected[index]);
    }

    function evaluateSavedChoice(q, reason = "choice-wrong") {
      if (!isChoice(q)) return;
      const saved = state.answers[q.id];
      if (!hasAnyAnswer(q, saved)) {
        delete state.wrong[q.id];
        return;
      }
      const correct = isChoiceAnswerCorrect(q, saved);
      state.answers[q.id] = {
        ...saved,
        checked: true,
        correct,
        checkedAt: saved.checkedAt || new Date().toISOString(),
      };
      if (correct) delete state.wrong[q.id];
      else state.wrong[q.id] = { reason, updatedAt: new Date().toISOString() };
    }

    function evaluateChoiceIds(ids, reason = "choice-wrong") {
      ids.map(id => byId[id]).filter(Boolean).forEach(q => evaluateSavedChoice(q, reason));
      saveState();
    }

    function saveDraftForQuestion(q) {
      if (!q) return;
      const answerData = collectAnswer(q);
      const existing = state.answers[q.id];
      if (!hasAnyAnswer(q, answerData)) {
        if (isChoice(q)) delete state.wrong[q.id];
        if (existing && existing.checked) {
          state.answers[q.id] = { ...answerData, checked: false, draftAt: new Date().toISOString() };
          saveState();
        }
        if (existing && !existing.checked) {
          delete state.answers[q.id];
          saveState();
        }
        return;
      }
      const existingSignature = existing ? answerSignature(existing) : "";
      const nextSignature = answerSignature(answerData);
      const record = existing && existingSignature === nextSignature
        ? { ...existing, ...answerData, draftAt: new Date().toISOString() }
        : { ...answerData, checked: false, draftAt: new Date().toISOString() };
      state.answers[q.id] = record;
      saveState();
    }

    function saveCurrentDraft() {
      if (!session) return;
      const q = byId[session.ids[currentIndex]];
      if (q) saveDraftForQuestion(q);
    }

    function setMode(nextMode) {
      mode = nextMode;
      document.querySelectorAll("[data-mode]").forEach(button => button.classList.toggle("active", button.dataset.mode === mode));
      el("practiceControls").classList.toggle("hidden", mode === "wrong" || mode === "search");
      el("typeControls").classList.toggle("hidden", mode === "random");
      el("wrongControls").classList.toggle("hidden", mode !== "wrong");
      el("searchControls").classList.toggle("hidden", mode !== "search");
      if (mode === "wrong") renderWrongList();
      if (mode === "search") renderSearch();
    }

    function setRange(nextRange) {
      selectedRange = nextRange;
      document.querySelectorAll("[data-range]").forEach(button => button.classList.toggle("active", button.dataset.range === selectedRange));
    }

    function poolForCurrentControls(single = false) {
      let pool = QUESTION_BANK;
      if (mode === "type") pool = pool.filter(q => q.group === selectedGroup);
      if (selectedRange === "priority") pool = pool.filter(q => q.isPriority);
      pool = shuffle(pool);
      return single ? pool.slice(0, 1) : pool;
    }

    function startSession(questions, title) {
      if (session) saveCurrentDraft();
      if (!questions.length) {
        showEmpty("没有符合条件的题目。");
        return;
      }
      session = {
        title,
        ids: questions.map(q => q.id),
        startedAt: new Date().toISOString(),
      };
      currentReview = null;
      currentIndex = 0;
      renderCurrentQuestion();
    }

    function startPractice(single = false) {
      const titleBase = mode === "random" ? "随机出题" : selectedGroup;
      const rangeText = selectedRange === "priority" ? "重点题" : "全部题";
      startSession(poolForCurrentControls(single), `${titleBase} · ${rangeText}`);
    }

    function startWrongPractice(showOnly = false) {
      let wrongIds = Object.keys(state.wrong).filter(id => byId[id]);
      if (selectedWrongGroup !== "全部") wrongIds = wrongIds.filter(id => byId[id].group === selectedWrongGroup);
      const questions = shuffle(wrongIds.map(id => byId[id]));
      if (showOnly) {
        renderReview(questions.map(q => q.id), "错题本", { wrongBook: true });
        return;
      }
      startSession(questions, `${selectedWrongGroup}错题重做`);
    }

    function updateNav() {
      const hasSession = !!session;
      el("prevBtn").disabled = !hasSession || currentIndex <= 0;
      el("nextBtn").disabled = !hasSession || currentIndex >= session.ids.length - 1;
      el("finishBtn").disabled = !hasSession;
    }

    function renderCurrentQuestion() {
      if (!session) {
        showEmpty("选择一种模式开始复习。");
        return;
      }
      const q = byId[session.ids[currentIndex]];
      el("viewTitle").textContent = session.title;
      el("viewSubTitle").textContent = `第 ${currentIndex + 1} / ${session.ids.length} 题`;
      updateNav();
      el("stage").innerHTML = questionHtml(q);
      bindQuestion(q);
    }

    function questionHtml(q) {
      const saved = state.answers[q.id];
      const showAnswer = !!(saved && saved.checked);
      const self = state.self[q.id] || "";
      const resultTag = saved && typeof saved.correct === "boolean"
        ? `<span class="tag ${saved.correct ? "good" : "bad"}">${saved.correct ? "正确" : "错误"}</span>`
        : "";
      return `
        <article class="question-card">
          <div class="question-meta">
            <span class="tag">${q.group} ${q.number}</span>
            ${isChoice(q) ? `<span class="tag">${q.choiceKind || (q.type === "multiple" ? "多选" : "单选")}</span>` : ""}
            <span class="tag ${questionLevelClass(q)}">${q.levelLabel}</span>
            ${resultTag}
          </div>
          <h2 class="stem">${escapeHtml(q.stem)}</h2>
          ${renderAnswerArea(q)}
          <div class="actions">
            <button id="checkAnswerBtn" class="primary">${isChoice(q) ? "提交并检查" : "查看答案"}</button>
            ${q.group === "填空题" ? '<button id="editBlankBtn">编辑挖空</button>' : ""}
            ${isChoice(q) ? '<button id="markWrongBtn">加入错题</button><button id="removeWrongBtn">移出错题</button>' : ""}
          </div>
          <div id="answerPanel" class="answer-panel ${showAnswer ? "" : "hidden"}">
            ${renderAnswerPanel(q)}
          </div>
          ${isChoice(q) ? "" : renderSelfRow(q, self)}
        </article>
      `;
    }

    function renderAnswerArea(q) {
      const saved = state.answers[q.id];
      if (isChoice(q)) {
        const selected = Array.isArray(saved?.value) ? saved.value : [];
        const inputType = q.type === "multiple" ? "checkbox" : "radio";
        return `<div class="options">
          ${q.options.map(option => `
            <label class="option">
              <input type="${inputType}" name="choice-${q.id}" value="${escapeAttr(option.key)}" ${selected.includes(option.key) ? "checked" : ""}>
              <span><strong>${escapeHtml(option.key)}.</strong>${escapeHtml(option.text)}</span>
            </label>
          `).join("")}
        </div>`;
      }
      if (q.group === "填空题") {
        const blanks = getBlankList(q);
        const values = saved?.blankValues || [];
        return `
          <div class="tag">本题共 ${blanks.length} 空</div>
          <div class="blank-grid">
            ${blanks.map((_, index) => `
              <label class="blank-input">
                <span>第 ${index + 1} 空</span>
                <input type="text" data-blank-index="${index}" value="${escapeAttr(values[index] || "")}" placeholder="填写答案">
              </label>
            `).join("")}
          </div>`;
      }
      return `<textarea class="answer-input" id="textAnswer" placeholder="在这里写下自己的答案">${escapeHtml(saved?.value || "")}</textarea>`;
    }

    function renderAnswerPanel(q) {
      const user = getQuestionUserAnswer(q);
      return `
        <h3>参考答案</h3>
        <div class="answer-block">${escapeHtml(formatAnswer(q))}</div>
        <h3>你的作答</h3>
        <div class="answer-block">${escapeHtml(user || "尚未作答")}</div>
      `;
    }

    function renderSelfRow(q, self) {
      const normalized = normalizedSelf(self);
      return `
        <div class="self-row" data-self-row="${q.id}">
          <button class="mastered ${normalized === "mastered" ? "active" : ""}" data-self="mastered">掌握</button>
          <button class="unfamiliar ${normalized === "unfamiliar" ? "active" : ""}" data-self="unfamiliar">不熟悉</button>
        </div>
      `;
    }

    function bindQuestion(q) {
      el("checkAnswerBtn").addEventListener("click", () => checkQuestion(q));
      const markWrongBtn = el("markWrongBtn");
      if (markWrongBtn) markWrongBtn.addEventListener("click", () => {
        state.wrong[q.id] = { reason: "manual", updatedAt: new Date().toISOString() };
        saveState();
        renderCurrentQuestion();
        toast("已加入错题本");
      });
      const removeWrongBtn = el("removeWrongBtn");
      if (removeWrongBtn) removeWrongBtn.addEventListener("click", () => {
        delete state.wrong[q.id];
        saveState();
        renderCurrentQuestion();
        toast("已移出错题本");
      });
      const editBtn = el("editBlankBtn");
      if (editBtn) editBtn.addEventListener("click", () => openBlankEditor(q));
      document.querySelectorAll("[data-self]").forEach(button => {
        button.addEventListener("click", () => setSelf(q, button.dataset.self));
      });
      document.querySelectorAll(`input[name="choice-${q.id}"]`).forEach(input => {
        input.addEventListener("change", () => saveDraftForQuestion(q));
      });
      document.querySelectorAll("[data-blank-index]").forEach(input => {
        input.addEventListener("input", () => saveDraftForQuestion(q));
      });
      const textAnswer = el("textAnswer");
      if (textAnswer) textAnswer.addEventListener("input", () => saveDraftForQuestion(q));
    }

    function collectAnswer(q) {
      if (isChoice(q)) {
        const selected = Array.from(document.querySelectorAll(`input[name="choice-${q.id}"]:checked`)).map(input => input.value).sort();
        return { value: selected };
      }
      if (q.group === "填空题") {
        const values = Array.from(document.querySelectorAll("[data-blank-index]")).map(input => input.value.trim());
        return { value: values.filter(Boolean).join("；"), blankValues: values };
      }
      return { value: el("textAnswer")?.value.trim() || "" };
    }

    function checkQuestion(q) {
      const answerData = collectAnswer(q);
      if (isChoice(q) && !hasAnyAnswer(q, answerData)) {
        saveDraftForQuestion(q);
        toast("请先选择答案");
        return;
      }
      const record = {
        ...answerData,
        checked: true,
        checkedAt: new Date().toISOString(),
      };
      if (isChoice(q)) {
        record.correct = isChoiceAnswerCorrect(q, answerData);
        if (record.correct) delete state.wrong[q.id];
        else state.wrong[q.id] = { reason: "choice-wrong", updatedAt: new Date().toISOString() };
      }
      state.answers[q.id] = record;
      state.history.unshift({ id: q.id, at: record.checkedAt, correct: record.correct ?? null });
      state.history = state.history.slice(0, 300);
      saveState();
      renderCurrentQuestion();
    }

    function setSelf(q, value) {
      state.self[q.id] = value;
      if (value === "mastered") delete state.wrong[q.id];
      if (value === "unfamiliar") state.wrong[q.id] = { reason: value, updatedAt: new Date().toISOString() };
      saveState();
      if (session) renderCurrentQuestion();
      else if (currentReview) renderReview(currentReview.ids, currentReview.title, currentReview.options || {});
      else renderAll();
    }

    function removeWrongFromReview(id) {
      delete state.wrong[id];
      saveState();
      if (currentReview) {
        const nextIds = (currentReview.options && currentReview.options.wrongBook)
          ? currentReview.ids.filter(itemId => itemId !== id && state.wrong[itemId])
          : currentReview.ids;
        renderReview(nextIds, currentReview.title, currentReview.options || {});
      }
    }

    function renderReview(ids, title = "本轮检查", options = {}) {
      if (session) saveCurrentDraft();
      if (options.evaluateChoices) evaluateChoiceIds(ids, "choice-wrong");
      session = null;
      currentReview = { ids: [...ids], title, options };
      updateNav();
      const questions = ids.map(id => byId[id]).filter(Boolean);
      el("viewTitle").textContent = title;
      el("viewSubTitle").textContent = `${questions.length} 道题`;
      if (!questions.length) {
        showEmpty("这里暂时没有题目。");
        return;
      }
      el("stage").innerHTML = `<div class="review-list">
        ${questions.map(q => {
          const saved = state.answers[q.id];
          const isWrong = !!state.wrong[q.id];
          const result = saved && typeof saved.correct === "boolean"
            ? `<span class="tag ${saved.correct ? "good" : "bad"}">${saved.correct ? "正确" : "错误"}</span>`
            : "";
          return `<article class="review-item ${isWrong ? "wrong-review" : ""}">
            <div class="question-meta">
              <span class="tag">${q.group} ${q.number}</span>
              ${isChoice(q) ? `<span class="tag">${q.choiceKind || (q.type === "multiple" ? "多选" : "单选")}</span>` : ""}
              <span class="tag ${questionLevelClass(q)}">${q.levelLabel}</span>
              ${result}
              ${state.wrong[q.id] ? '<span class="tag bad">错题</span>' : ""}
            </div>
            ${isWrong ? '<div class="wrong-banner">错题：建议重点复习并重做</div>' : ""}
            <h3>${escapeHtml(q.stem)}</h3>
            ${q.options && q.options.length ? `<div class="small">${q.options.map(o => `${escapeHtml(o.key)}. ${escapeHtml(o.text)}`).join("<br>")}</div>` : ""}
            <div class="answer-panel">
              <h3>你的作答</h3>
              <div class="answer-block">${escapeHtml(getQuestionUserAnswer(q) || "尚未作答")}</div>
              <h3>参考答案</h3>
              <div class="answer-block">${escapeHtml(formatAnswer(q))}</div>
              ${isChoice(q) || options.wrongBook ? "" : renderSelfRow(q, state.self[q.id] || "")}
              ${options.wrongBook && state.wrong[q.id] ? `<div class="actions"><button data-remove-wrong="${q.id}">移出错题</button></div>` : ""}
            </div>
          </article>`;
        }).join("")}
      </div>`;
      document.querySelectorAll("[data-self]").forEach(button => {
        button.addEventListener("click", () => setSelf(byId[button.closest("[data-self-row]").dataset.selfRow], button.dataset.self));
      });
      document.querySelectorAll("[data-remove-wrong]").forEach(button => {
        button.addEventListener("click", () => removeWrongFromReview(button.dataset.removeWrong));
      });
    }

    function showEmpty(message) {
      session = null;
      currentReview = null;
      updateNav();
      el("stage").innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
      el("viewTitle").textContent = "准备开始";
      el("viewSubTitle").textContent = "选择一种模式开始复习。";
    }

    function renderStats() {
      const answered = Object.keys(state.answers).length;
      const wrong = Object.keys(state.wrong).filter(id => byId[id]).length;
      const priority = QUESTION_BANK.filter(q => q.isPriority).length;
      const mastered = Object.values(state.self).filter(v => v === "mastered").length;
      el("stats").innerHTML = [
        ["题库总数", QUESTION_BANK.length],
        ["重点题", priority],
        ["已检查", answered],
        ["错题本", wrong],
        ["主观掌握", mastered],
      ].map(([label, value]) => `<div class="stat"><strong>${value}</strong><span>${label}</span></div>`).join("");
    }

    function renderTypeButtons() {
      el("typeButtons").innerHTML = GROUPS.map(group => `<button data-group="${group}" class="${group === selectedGroup ? "active" : ""}">${group}</button>`).join("");
      document.querySelectorAll("[data-group]").forEach(button => {
        button.addEventListener("click", () => {
          selectedGroup = button.dataset.group;
          renderTypeButtons();
        });
      });
      const wrongGroups = ["全部", ...GROUPS];
      el("wrongTypeButtons").innerHTML = wrongGroups.map(group => `<button data-wrong-group="${group}" class="${group === selectedWrongGroup ? "active" : ""}">${group}</button>`).join("");
      document.querySelectorAll("[data-wrong-group]").forEach(button => {
        button.addEventListener("click", () => {
          selectedWrongGroup = button.dataset.wrongGroup;
          renderTypeButtons();
          renderWrongList();
        });
      });
    }

    function renderBankSummary() {
      const counts = GROUPS.map(group => `${group} ${QUESTION_BANK.filter(q => q.group === group).length}`).join("<br>");
      const priority = QUESTION_BANK.filter(q => q.isPriority).length;
      el("bankSummary").innerHTML = `${counts}<br>重点题 ${priority}<br><br>数据来自：食品安全与质量控制题型分类.docx`;
    }

    function renderWrongList() {
      const ids = Object.keys(state.wrong).filter(id => byId[id]);
      const filtered = selectedWrongGroup === "全部" ? ids : ids.filter(id => byId[id].group === selectedWrongGroup);
      el("viewTitle").textContent = "错题本";
      el("viewSubTitle").textContent = `${filtered.length} 道题`;
      if (mode === "wrong") renderReview(filtered, "错题本", { wrongBook: true });
    }

    function renderSearch() {
      const query = el("searchInput").value.trim().toLowerCase();
      const results = query
        ? QUESTION_BANK.filter(q => {
            const haystack = `${q.group} ${q.number} ${q.stem} ${q.answerText || ""} ${(q.blanks || []).join(" ")}`.toLowerCase();
            return haystack.includes(query);
          }).slice(0, 80)
        : [];
      el("searchResults").innerHTML = results.map(q => `
        <div class="mini-item" data-open-question="${q.id}">
          <div class="mini-meta">
            <span>${q.group} ${q.number}</span>
            <span>${q.levelLabel}</span>
          </div>
          <div class="mini-stem">${escapeHtml(q.stem)}</div>
        </div>
      `).join("") || `<div class="small">${query ? "没有找到匹配题目。" : "输入关键词后显示结果。"}</div>`;
      document.querySelectorAll("[data-open-question]").forEach(item => {
        item.addEventListener("click", () => startSession([byId[item.dataset.openQuestion]], "搜索结果"));
      });
    }

    function openBlankEditor(q) {
      const blanks = getBlankList(q);
      openModal("编辑挖空", `
        <p class="small">每行一个空。保存后会影响本题显示的空数和参考答案。</p>
        <textarea id="blankEditor">${escapeHtml(blanks.join("\\n"))}</textarea>
      `, () => {
        const next = el("blankEditor").value.split("\\n").map(line => line.trim()).filter(Boolean);
        if (!next.length) {
          toast("至少保留一个空");
          return false;
        }
        state.blankOverrides[q.id] = next;
        saveState();
        renderCurrentQuestion();
        toast("挖空已保存");
        return true;
      });
    }

    function openImportModal(text) {
      openModal("导入学习数据", `
        <p class="small">粘贴之前导出的 JSON，保存后会覆盖当前本地记录。</p>
        <textarea id="importText">${escapeHtml(text || "")}</textarea>
      `, () => {
        try {
          const data = JSON.parse(el("importText").value);
          state = { ...defaultState(), ...data };
          saveState();
          renderAll();
          toast("导入完成");
          return true;
        } catch {
          toast("JSON 格式不正确");
          return false;
        }
      });
    }

    function openModal(title, body, onSave) {
      el("modalTitle").textContent = title;
      el("modalBody").innerHTML = body;
      modalHandler = onSave;
      el("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      el("modalBackdrop").classList.remove("open");
      modalHandler = null;
    }

    function exportData() {
      const payload = JSON.stringify(state, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "食品安全与质量控制复习记录.json";
      link.click();
      URL.revokeObjectURL(url);
      openModal("导出学习数据", `<p class="small">如果浏览器没有自动下载，也可以复制下面的 JSON。</p><textarea readonly>${escapeHtml(payload)}</textarea>`, () => true);
    }

    function resetData() {
      if (!confirm("确定清空所有本地学习记录、错题和填空编辑吗？")) return;
      state = defaultState();
      saveState();
      renderAll();
      showEmpty("记录已清空，可以重新开始。");
    }

    function toast(message) {
      el("toast").textContent = message;
      el("toast").classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el("toast").classList.remove("show"), 1800);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    function bindGlobalEvents() {
      document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => setMode(button.dataset.mode)));
      document.querySelectorAll("[data-range]").forEach(button => button.addEventListener("click", () => setRange(button.dataset.range)));
      el("startBtn").addEventListener("click", () => startPractice(false));
      el("oneRandomBtn").addEventListener("click", () => startPractice(true));
      el("startWrongBtn").addEventListener("click", () => startWrongPractice(false));
      el("showWrongBtn").addEventListener("click", () => startWrongPractice(true));
      el("prevBtn").addEventListener("click", () => { if (session && currentIndex > 0) { saveCurrentDraft(); currentIndex--; renderCurrentQuestion(); } });
      el("nextBtn").addEventListener("click", () => { if (session && currentIndex < session.ids.length - 1) { saveCurrentDraft(); currentIndex++; renderCurrentQuestion(); } });
      el("finishBtn").addEventListener("click", () => { if (session) { saveCurrentDraft(); renderReview(session.ids, "本轮检查", { evaluateChoices: true }); } });
      el("searchInput").addEventListener("input", renderSearch);
      el("exportBtn").addEventListener("click", exportData);
      el("importBtn").addEventListener("click", () => el("importFile").click());
      el("importFile").addEventListener("change", event => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => openImportModal(reader.result);
        reader.readAsText(file);
        event.target.value = "";
      });
      el("resetBtn").addEventListener("click", resetData);
      el("modalCancel").addEventListener("click", closeModal);
      el("modalBackdrop").addEventListener("click", event => {
        if (event.target === el("modalBackdrop")) closeModal();
      });
      el("modalSave").addEventListener("click", () => {
        if (!modalHandler || modalHandler() !== false) closeModal();
      });
    }

    function renderAll() {
      renderStats();
      renderTypeButtons();
      renderBankSummary();
    }

    bindGlobalEvents();
    renderAll();
    showEmpty("选择一种模式开始复习。");
  </script>
</body>
</html>
